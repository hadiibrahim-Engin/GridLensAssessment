# Test tools only; the PowerFactory runtime needs none. Install with
# `python -m pip install --group dev` (pip 25.1 or newer). Versions stay open on purpose.
[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gui: requires a real interactive desktop (Tk or optional PyQt)",
    "optional_qt: native Qt smoke test requiring a separately managed PyQt installation",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks; avoid a repository-wide formatting migration.
select = ["E9", "F63", "F7", "F82"]

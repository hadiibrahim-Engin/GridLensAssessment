# Outage Assessment quality check: Ruff and the test suite, for main.py (tk) and main_qt.py (qt).
# Nothing is kept in the repository; only the test results are shown in the run.
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - '*.md'

# Pull requests (GitHub); in Azure Repos a branch policy starts the same pipeline.
pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  pythonVersion: '3.11'

jobs:
  - job: Tests
    timeoutInMinutes: 20
    strategy:
      matrix:
        tk:
          runtime: tk
        qt:
          runtime: qt
    steps:
      - checkout: self
        persistCredentials: false

      - task: UsePythonVersion@0
        displayName: Use Python $(pythonVersion)
        inputs:
          versionSpec: $(pythonVersion)

      - script: python -m pip install --upgrade pip && python -m pip install --group dev
        displayName: Install test tools (pyproject.toml, group dev)

      - script: python -m ruff check . --output-format=azure
        displayName: Ruff

      - script: python -m pytest -v -ra -m "not gui" --gui-timeout=60 --junitxml="$(Agent.TempDirectory)/pytest.xml"
        displayName: Unattended tests ($(runtime), no native GUI)
        env:
          OUTAGE_ASSESSMENT_TEST_RUNTIME: $(runtime)
          PYTHONUTF8: '1'

      - task: PublishTestResults@2
        displayName: Show test results
        condition: succeededOrFailed()
        inputs:
          testResultsFiles: '$(Agent.TempDirectory)/pytest.xml'
          testRunTitle: Outage Assessment $(runtime)
          failTaskOnMissingResultsFile: true
